<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle with padding for maskable -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Inner Industrial Card -->
  <rect x="56" y="56" width="400" height="400" rx="48" fill="#ffffff" filter="url(#shadow)" />

  <!-- Grid lines -->
  <line x1="96" y1="140" x2="416" y2="140" stroke="#f1f5f9" stroke-width="3" />
  <line x1="96" y1="210" x2="416" y2="210" stroke="#f1f5f9" stroke-width="3" />
  <line x1="96" y1="280" x2="416" y2="280" stroke="#f1f5f9" stroke-width="3" />
  <line x1="96" y1="350" x2="416" y2="350" stroke="#e2e8f0" stroke-width="4" />

  <!-- 80% line dashed -->
  <line x1="96" y1="185" x2="416" y2="185" stroke="#e11d48" stroke-width="3.5" stroke-dasharray="8 6" />

  <!-- Pareto Bars -->
  <!-- Bar 1 (Highest) -->
  <rect x="120" y="150" width="56" height="200" rx="8" fill="url(#bar1)" />
  <!-- Bar 2 -->
  <rect x="196" y="210" width="56" height="140" rx="8" fill="url(#bar2)" />
  <!-- Bar 3 -->
  <rect x="272" y="265" width="56" height="85" rx="8" fill="url(#bar3)" />
  <!-- Bar 4 -->
  <rect x="348" y="305" width="56" height="45" rx="8" fill="#cbd5e1" />

  <!-- Cumulative Curve -->
  <path d="M 148 290 Q 224 210 300 170 T 376 135" fill="none" stroke="#4f46e5" stroke-width="6" stroke-linecap="round" />

  <!-- Curve Nodes -->
  <circle cx="148" cy="290" r="7" fill="#ffffff" stroke="#4f46e5" stroke-width="4" />
  <circle cx="224" cy="210" r="7" fill="#ffffff" stroke="#4f46e5" stroke-width="4" />
  <circle cx="300" cy="170" r="7" fill="#ffffff" stroke="#4f46e5" stroke-width="4" />
  <circle cx="376" cy="135" r="7" fill="#ffffff" stroke="#4f46e5" stroke-width="4" />

  <!-- Tech Gear / Industrial Emblem top right -->
  <circle cx="130" cy="100" r="14" fill="#2563eb" />
  <text x="130" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">80</text>
  <text x="160" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#1e293b">DowntimePro</text>
</svg>
